{% extends "base.html" %}

{% block title %}Ieșire - Senzor Calitate{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card text-center">
                <div class="card-body py-5">
                    <h1 class="display-4 mb-3">👋</h1>
                    <h2 class="card-title h4 mb-3">Ai fost deconectat</h2>
                    <p class="card-text text-muted mb-4">
                        Sesiunea ta s-a încheiat cu succes. Puteți accesa din nou sistemul.
                    </p>
                    
                    <a href="{% url 'qr_login:start' %}" class="btn btn-primary">
                        🔐 Conectează-te Din Nou
                    </a>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-muted small">
                    Dacă ai nevoie de asistență, <a href="#">contactează suportul</a>.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
