<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profil utilizator</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>
<body class="bg-light"><main class="container py-4 py-md-5"><header class="mb-4"><p class="text-uppercase text-secondary small mb-1">Cont</p><h1 class="h2 mb-0">Profil utilizator</h1></header>{% if supabase_user_id %}<dl class="row bg-white border rounded-3 p-4 mx-0"><dt class="col-sm-4 text-secondary fw-normal">ID utilizator Supabase</dt><dd class="col-sm-8 text-break">{{ supabase_user_id }}</dd><dt class="col-sm-4 text-secondary fw-normal">Conectat la</dt><dd class="col-sm-8">{{ authenticated_at }}</dd></dl>{% else %}<div class="alert alert-secondary">Nu exista o sesiune QR activa.</div><a class="btn btn-primary" href="{% url 'qr_login:start' %}">Conectare prin QR</a>{% endif %}</main></body></html>
