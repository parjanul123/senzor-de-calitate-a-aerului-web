<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download aplicația Android - Calitate Sensor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    body {
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .download-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 380px;
      padding: 36px;
      text-align: center;
      width: 100%;
    }
    .download-title {
      color: #1a1a1a;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .download-subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 26px;
    }
    .download-qr-box {
      align-items: center;
      background: #f5f5f5;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
      padding: 16px;
    }
    .download-qr-box img {
      border-radius: 8px;
      max-width: 100%;
    }
    .download-link {
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="download-container">
    <h1 class="download-title">Aplicația Android</h1>
    <p class="download-subtitle">Scanează codul QR cu telefonul sau apasă butonul pentru a descărca APK-ul.</p>

    <div class="download-qr-box">
      <img src="{{ android_app_qr_image }}" alt="Cod QR pentru instalarea aplicației Android" width="260" height="260">
    </div>

    <a class="btn btn-primary w-100 mb-3" href="{{ android_app_download_url }}" download>
      Download aplicația Android
    </a>
    <div class="download-link small text-muted">{{ android_app_download_url }}</div>
  </main>
</body>
</html>
